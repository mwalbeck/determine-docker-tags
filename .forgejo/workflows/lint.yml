name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run checks
        run: |
          poetry install --with dev
          poetry run ruff check determine_docker_tags
          poetry run pytest

  docker:
    runs-on: dind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get docker tags
        id: tags
        shell: sh
        env:
          CUSTOM_TAGS: ${{ forgejo.SHA }}
          IMAGE_NAME: "git.walbeck.it/walbeck-it/determine-docker-tags"
        run: |
          determine-docker-tags
          dockerd &

      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: actions/docker-build-push@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.tags.outputs.tags }}
